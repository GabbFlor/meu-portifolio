<section>
    <div class="overlay" (click)="closeModal()"></div>

    <div class="modal">
        <swiper-container loop="true" navigation="true" class="carousel" speed="300">
            <swiper-slide class="slide">
                <img src="assets/imgs-projetos/instalar/home-1.png" alt="">
            </swiper-slide>

            <swiper-slide class="slide">
                <img src="assets/imgs-projetos/instalar/home-2.png" alt="">
            </swiper-slide>

            <swiper-slide class="slide">
                <img src="assets/imgs-projetos/instalar/home-3.png" alt="">
            </swiper-slide>
        </swiper-container>

        <h1>Titulo: {{ modalContent ? (modalContent.title | translate) : "Carregando..." }}</h1><br>
        <p>Conteudo: {{ modalContent ? (modalContent.text | translate) : "Carregando..." }}</p><br>
    </div>
</section>
